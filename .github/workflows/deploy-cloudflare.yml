name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Verify migrations locally
        working-directory: backend
        run: npm test

      - name: Verify Cloudflare resources are aligned
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/workers/scripts" \
            | jq -e '.result | map(.id) | index("muddy-tooth-e4be") != null'
          npx --yes wrangler d1 list --json | jq -e 'map(select(.name == "sss")) | length == 1'
          npx --yes wrangler r2 bucket list | awk '$1 == "name:" && $2 == "sss" {count++} END {exit !(count == 1)}'
      - name: Deploy Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy

      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler d1 migrations apply sss --remote

      - name: Verify D1 schema
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute sss --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_cf_%' ORDER BY name;" > /tmp/schema.txt
          grep -q "users" /tmp/schema.txt
          grep -q "posts" /tmp/schema.txt
          grep -q "sessions" /tmp/schema.txt
          grep -q "conversations" /tmp/schema.txt
          grep -q "messages" /tmp/schema.txt
          grep -q "notifications" /tmp/schema.txt
          npx --yes wrangler d1 execute sss --remote --command "PRAGMA table_info(post_media);" > /tmp/post-media-schema.txt
          grep -q "owner_id" /tmp/post-media-schema.txt
          grep -q "source" /tmp/post-media-schema.txt
          grep -q "external_url" /tmp/post-media-schema.txt
          grep -q "metadata_json" /tmp/post-media-schema.txt
          grep -q "duration_ms" /tmp/post-media-schema.txt
          grep -q "post_id" /tmp/post-media-schema.txt

      - name: Verify live health
        env:
          HEALTH_URL: https://muddy-tooth-e4be.binancecompany274.workers.dev/api/health
        run: |
          curl --fail-with-body --silent --show-error ${HEALTH_URL} | tee /tmp/health.json
          jq -e '.ok == true and .service == "sss-api"' /tmp/health.json

      - name: Run live persistence E2E
        env:
          LIVE_API_BASE_URL: https://muddy-tooth-e4be.binancecompany274.workers.dev
          TEST_ORIGIN: https://sphereis.netlify.app
          TEST_USERNAME: e2e_${{ github.run_id }}
          TEST_EMAIL: e2e_${{ github.run_id }}@example.invalid
          TEST_PASSWORD: S-live-E2E-${{ github.run_id }}-secure
        run: node backend/scripts/live-e2e.mjs

      - name: Cleanup live E2E data
        if: always()
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_USERNAME: e2e_${{ github.run_id }}
        run: |
          set -euo pipefail
          npx --yes wrangler d1 execute sss --remote --command "SELECT object_key FROM post_media WHERE post_id IN (SELECT id FROM posts WHERE author_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}')) AND source = 'upload';" --json > /tmp/e2e-media.json
          jq -r '.. | objects | .object_key? // empty' /tmp/e2e-media.json | while IFS= read -r key; do
            [ -n "$key" ] || continue
            npx --yes wrangler r2 object delete "sss/$key" --remote
          done
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/r2/buckets/sss/objects?prefix=users/&per_page=1000&include=customMetadata" \
            | jq -r '.result[] | select(.key | endswith("-e2e.png")) | .key' \
            | while IFS= read -r key; do
                [ -n "$key" ] || continue
                npx --yes wrangler r2 object delete "sss/$key" --remote
              done
          npx --yes wrangler d1 execute sss --remote --command "DELETE FROM posts WHERE author_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}'); DELETE FROM sessions WHERE user_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}'); DELETE FROM relationships WHERE source_user_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}') OR target_user_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}') OR source_user_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}') OR target_user_id = (SELECT id FROM users WHERE username = '${TEST_USERNAME}'); DELETE FROM users WHERE username = '${TEST_USERNAME}';"
