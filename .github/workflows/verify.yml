name: Verify
# Verification trigger: run on every main push and pull request.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Verify boundaries and integration
        run: npm run verify:all

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production API endpoint in bundle
        run: |
          grep -R -q "muddy-tooth-e4be.binancecompany274.workers.dev" dist/assets
          echo "PASS production bundle contains the Cloudflare API endpoint"
