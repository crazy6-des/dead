name: Verify
# Verification trigger: run on every main push and pull request.

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify boundaries and integration
        run: npm run verify:all

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
