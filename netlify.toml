[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src package.json package-lock.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = ""

[[redirects]]
  from = "/api/*"
  to = "https://muddy-tooth-e4be.binancecompany274.workers.dev/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
